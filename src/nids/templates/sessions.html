<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sessions - Sentinel NIDS Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 0; background: #0f1420; color: #e6e9ef; }
  header { padding: 20px 28px; border-bottom: 1px solid #1f2635; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.3px; display: inline-block;}
  nav { display: inline-flex; gap: 15px; margin-left: 20px; }
  nav a { color: #97a2b8; text-decoration: none; font-size: 14px; }
  nav a:hover, nav a.active { color: #fff; }
  .container { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #1f2635; }
  th { color: #97a2b8; font-weight: 500; text-transform: uppercase; font-size: 11px; }
  tr:hover { background: #131a29; }
</style>
</head>
<body>
<header>
  <div>
    <h1>&#128737;&#65039; Sentinel NIDS</h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/hosts">Hosts</a>
      <a href="/sessions" class="active">Sessions</a>
    </nav>
  </div>
</header>
<div class="container">
  <h2>Active/Recent Sessions</h2>
  <table id="sessionsTable">
    <thead>
      <tr><th>Session ID</th><th>Source</th><th>Destination</th><th>State</th><th>Service</th><th>Duration (s)</th><th>Bytes</th></tr>
    </thead>
    <tbody id="sessionsBody">
      <!-- Populated via JS -->
    </tbody>
  </table>
</div>
<script>
  fetch('/api/sessions')
    .then(r => r.json())
    .then(sessions => {
      const tbody = document.getElementById('sessionsBody');
      sessions.forEach(s => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${s.session_id}</td>
          <td>${s.src_ip}:${s.src_port}</td>
          <td>${s.dst_ip}:${s.dst_port}</td>
          <td>${s.state}</td>
          <td>${s.service || s.tls_sni || s.http_host || '-'}</td>
          <td>${(s.duration || 0).toFixed(2)}</td>
          <td>${s.bytes_sent + s.bytes_recv}</td>
        `;
        tbody.appendChild(row);
      });
    });
</script>
</body>
</html>
